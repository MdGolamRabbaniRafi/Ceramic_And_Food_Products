name: 🚀 Deploy via FTP

on:
  push:
    branches:
      - dev

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # ✅ Debug: check if secrets are populated (without revealing them)
      - name: Debug secrets presence
        run: |
          echo "Debugging secrets..."
          if [ -z "${{ secrets.FTP_SERVER }}" ]; then
            echo "❌ FTP_SERVER is missing"
          else
            echo "✅ FTP_SERVER is set"
          fi

          if [ -z "${{ secrets.FTP_USERNAME }}" ]; then
            echo "❌ FTP_USERNAME is missing"
          else
            echo "✅ FTP_USERNAME is set"
          fi

          if [ -z "${{ secrets.FTP_PASSWORD }}" ]; then
            echo "❌ FTP_PASSWORD is missing"
          else
            echo "✅ FTP_PASSWORD is set"
          fi

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /home/cerasjuo/testingbackend.ceramicandfoodproducts.com/
