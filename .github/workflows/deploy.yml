name: 🚀 Deploy via FTP

on:
  push:
    branches:
      - dev

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # ✅ DEBUG: Check if secrets are loaded correctly
      - name: Debug Secrets
        run: |
          echo "Debugging Secrets..."
          echo "FTP_HOST: ${{ secrets.FTP_HOST }}"
          echo "FTP_USER: ${{ secrets.FTP_USER }}"
          echo "FTP_PASSWORD: ${# secrets.FTP_PASSWORD } characters long"
        shell: bash

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /home/cerasjuo/testingbackend.ceramicandfoodproducts.com/
