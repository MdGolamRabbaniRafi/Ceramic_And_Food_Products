name: 🚀 Deploy via FTP

on:
  push:
    branches:
      - dev

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # ✅ Debug: check if secrets are populated (without revealing them)
      - name: Debug secrets presence
        run: |
          echo "Debugging secrets..."
          if [ -z "${{ secrets.FTP_HOST }}" ]; then
            echo "❌ FTP_HOST is missing"
          else
            echo "✅ FTP_HOST is set"
          fi

          if [ -z "${{ secrets.FTP_USER }}" ]; then
            echo "❌ FTP_USER is missing"
          else
            echo "✅ FTP_USER is set"
          fi

          if [ -z "${{ secrets.FTP_PASSWORD }}" ]; then
            echo "❌ FTP_PASSWORD is missing"
          else
            echo "✅ FTP_PASSWORD is set"
          fi

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /home/cerasjuo/testingbackend.ceramicandfoodproducts.com/
